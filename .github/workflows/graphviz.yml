name: graphes
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Installation de graphviz
      run: sudo apt install graphviz
    - name: Check out repo code
      uses: actions/checkout@v3
    - name: Lancement graphviz
      run: ./run2.sh
    - name: upload du res
      uses: actions/upload-artifact@v4
      with:
        name: graphes
        path: "*.svg"
