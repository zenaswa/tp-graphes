name: graphes
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Installation de graphviz
      run: sudo apt install graphviz
    - name: Check out repo code
      uses: actions/checkout@v3
    - name: Lancement graphviz
      run: ./run1.sh g1
    - name: upload du res
      uses: actions/upload-artifact@v4
      with:
        name: graph1
        path: g1.svg
